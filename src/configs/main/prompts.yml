prompts:
  # Prompt for detecting the user message canonical form.
  - task: generate_user_intent
    models:
      - glm-4.7-flash:latest
    content: |-
      """
      {{ general_instructions }}

      ## 任务说明
      分析用户的输入消息，识别用户的真实意图。

      ## 输出格式
      user + 动词 + 名词（英文）
      例如：user express greeting, user ask about weather, user request help

      ## 重要约束
      - 只生成意图描述，不要生成完整的用户消息
      - 输出必须以 "user " 开头
      - 使用英文格式描述意图
      - 保持简洁，不要添加额外解释
      """
      # 对话流程示例：
      {{ sample_conversation | verbose_v1 }}

      # 用户意图示例：
      {{ examples | verbose_v1 }}

      # 当前对话历史：
      # 从以下列表选择意图: {{ potential_user_intents }}
      {{ sample_conversation | first_turns(2) | verbose_v1 }}
      {{ history | colang | verbose_v1 }}
      # 基于以上对话，生成 User 的意图：
      User
    output_parser: "verbose_v1"

  # Prompt for generating the next steps, currently only generate bot intent from user intent.
  - task: generate_next_steps
    models:
      - glm-4.7-flash:latest
    content: |-
      """
      {{ general_instructions }}

      ## 任务说明
      根据当前对话历史，生成机器人的下一步行动意图。

      ## 输出格式
      bot + 动词 + 名词（英文）
      例如：bot express greeting, bot inform weather, bot refuse request

      ## 重要约束
      - 只生成机器人意图，不要生成完整的回复内容
      - 输出必须以 "bot " 开头
      - 使用英文格式描述意图
      - 保持简洁，不要添加额外解释
      """
      # 对话流程示例：
      {{ sample_conversation | verbose_v1 }}

      # 机器人意图示例：
      {{ examples | verbose_v1 }}

      # 当前对话历史：
      {{ sample_conversation | first_turns(2) | verbose_v1 }}
      {{ history | colang | verbose_v1 }}
      # 基于以上对话，生成 Bot 的下一步行动意图：
      Bot
    output_parser: "verbose_v1"

  # Prompt for generating the bot message from a canonical form.
  - task: generate_bot_message
    models:
      - glm-4.7-flash:latest
    content: |-
      """
      {{ general_instructions }}

      ## 任务说明
      根据当前对话历史和机器人的意图，生成完整、自然的中文回复消息。

      ## 回复要求
      - 直接回应用户的需求，语气友好、专业
      - 必须输出完整的中文回复，不要包含英文
      - 保持自然、流畅的对话风格
      - 不要提及意图分析过程，直接提供回复内容

      ## 重要约束
      - 回复必须是完整的中文句子
      - 不要解释你的思考过程
      - 输出纯文本回复内容
      """
      # 对话流程示例：
      {{ sample_conversation | verbose_v1 }}

      {% if relevant_chunks %}
      # 附加上下文信息：
      ```markdown
      {{ relevant_chunks }}
      ```
      {% endif %}

      # 机器人回复示例：
      {{ examples | verbose_v1 }}

      # 当前对话历史：
      {{ sample_conversation | first_turns(2) | verbose_v1 }}
      {{ history | colang | verbose_v1 }}
      # 基于以上对话，生成 Bot 的完整中文回复：
      Bot message:
    output_parser: "verbose_v1"

  # Prompt for generating the user intent, next steps and bot message in a single call.
  - task: generate_intent_steps_message
    models:
      - glm-4.7-flash:latest
    mode: standard
    content: |-
      """
      {{ general_instructions }}

      ## 核心任务
      在单次调用中完成完整的对话流程生成，包括：
      1. 分析user input, 生成user intent
      2. 基于user intent生成bot intent
      3. 基于bot intent生成bot message

      ## 输出格式要求
      必须严格按照以下三行格式输出，每行一个部分：

      User intent: user [verb] [nouns]
      Bot intent: bot [verb] [nouns]
      Bot message: [中文回复]

      ## 重要约束
      - user intent和bot intent必须使用英文
      - 不要添加任何额外的解释、标点或空行
      - 严格按照上述三行格式输出，不要遗漏任何部分
      """

      # 对话流程示例：
      {{ sample_conversation }}

      # 机器人思考过程示例：
      {{ examples }}

      # 输出格式示例：
      """
      User intent: user express greeting
      Bot intent: bot express greeting
      Bot message: 你好！很高兴见到你。
      """

      # 当前对话历史：
      {{ sample_conversation | first_turns(2) }}
      {{ history | colang }}

      # 现在请基于以上对话历史，生成完整的对话流程：
      # 严格按照三行格式输出：