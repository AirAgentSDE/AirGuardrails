    user action: user said "你好"
    user intent: user expressed greeting
    bot intent: bot express greeting
    bot action: bot say "你好！有什么我可以帮助你的吗？"

    # 示例：用户请求代码
    user action: user said "写一个JavaScript防抖函数"
    user intent: user requested code generation
    bot intent: bot provide code solution
    bot action: bot say "```javascript\nfunction debounce(fn, delay = 300) {\n  let timer = null;\n  return function(...args) {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn.apply(this, args), delay);\n  };\n}\n```\n\n使用方式：`input.addEventListener('input', debounce(handleInput, 500))`"

