prompts:
  # Prompt for detecting the user message canonical form.
  - task: generate_user_intent
    content: |
      """
      {{ general_instructions }}

      ## Task
      Analyze the user's input message and identify the user's true intent.

      ## Output Format
      user + verb + noun (must in English)
      Examples: user express greeting, user ask about weather, user request help

      ## Constraints
      - Only generate the intent description, not the full user message
      - Output must start with "user "
      - Use English format for the intent description
      - Keep it concise, do not add extra explanations
      """
      # Sample conversation flows:
      {{ sample_conversation | verbose_v1 }}

      # User intent examples:
      {{ examples | verbose_v1 }}

      # Current conversation history:
      # Potential intents: {{ potential_user_intents }}
      {{ sample_conversation | first_turns(2) | verbose_v1 }}
      {{ history | colang | verbose_v1 }}
      # Based on the above conversation, generate the User intent:
    output_parser: "verbose_v1"

  # Prompt for generating the next steps, currently only generate bot intent from user intent.
  - task: generate_next_steps
    content: |
      """
      {{ general_instructions }}

      ## Task
      Based on the current conversation history, generate the bot's next action intent.

      ## Output Format
      bot + verb + noun (must in English)
      Examples: bot express greeting, bot inform weather, bot refuse request

      ## Constraints
      - Only generate the bot intent, not the full response content
      - Output must start with "bot "
      - Use English format for the intent description
      - Keep it concise, do not add extra explanations
      """
      # Sample conversation flows:
      {{ sample_conversation | verbose_v1 }}

      # Bot intent examples:
      {{ examples | verbose_v1 }}

      # Current conversation history:
      {{ sample_conversation | first_turns(2) | verbose_v1 }}
      {{ history | colang | verbose_v1 }}
      # Based on the above conversation, generate the Bot's next action intent:
    output_parser: "verbose_v1"

  # Prompt for generating the bot message from a canonical form.
  - task: generate_bot_message
    content: |
      """
      {{ general_instructions }}

      ## 任务
      根据当前对话历史和机器人的意图, 生成完整、自然的中文回复.

      ## 回复要求
      - 直接回应用户需求, 语气友好、专业
      - 必须输出完整的中文回复, 不要包含英文
      - 保持自然、流畅的对话风格
      - 不要提及意图分析过程, 直接提供回复内容

      ## 约束
      - 回复必须是完整的中文句子
      - 不要解释你的思考过程
      - 输出纯文本回复内容
      """
      # Sample conversation flows:
      {{ sample_conversation | verbose_v1 }}

      {% if relevant_chunks %}
      # Additional context:
      ```markdown
      {{ relevant_chunks }}
      ```
      {% endif %}

      # Bot response examples:
      {{ examples | verbose_v1 }}

      # Current conversation history:
      {{ sample_conversation | first_turns(2) | verbose_v1 }}
      {{ history | colang | verbose_v1 }}
      # 基于以上对话, 生成 Bot 的完整中文回复:
    output_parser: "verbose_v1"

  # Prompt for generating the user intent, next steps and bot message in a single call.
  - task: generate_intent_steps_message
    content: |
      """
      {{ general_instructions }}

      ## 核心任务
      在单次调用中完成完整的对话流程生成, 包括:
      1. 分析 user input, 生成 user intent
      2. 基于 user intent 生成 bot intent
      3. 基于 bot intent 生成 bot message

      ## 输出格式
      必须严格按照以下三行格式输出, 每行一个部分:

      User intent: user [verb] [nouns]
      Bot intent: bot [verb] [nouns]
      Bot message: [中文回复]

      ## 约束
      - User intent 和 Bot intent 必须使用英文
      - 不要添加任何额外的解释或空行
      - 严格按照三行格式输出, 不要遗漏任何部分
      - Bot message 必须是自然流畅的中文
      """

      # Sample conversation flows:
      {{ sample_conversation }}

      # For each user message, generate the next steps and finish with the bot message.
      # Bot reasoning examples:
      {{ examples }}

      # Output format example:
      """
      User intent: user express greeting
      Bot intent: bot express greeting
      Bot message: 你好!很高兴见到你.
      """

      # Current conversation history:
      {{ sample_conversation | first_turns(2) }}
      {{ history | colang }}

      # 基于以上对话历史, 生成完整的对话流程: